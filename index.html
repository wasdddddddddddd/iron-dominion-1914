<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>铁与权柄：1914 · 省份地图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f1a; cursor: default; touch-action: none; -ms-touch-action: none; overscroll-behavior: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            background: #0a0f1a; color: #8a7a5a; font-size: 18px;
            font-family: "Georgia", serif; z-index: 100;
            transition: opacity 0.6s; pointer-events: none;
        }
        #loading.hidden { opacity: 0; }
    </style>
</head>
<body oncontextmenu="return false;" style="overscroll-behavior:none;user-select:none;-webkit-user-select:none;">
<canvas id="gameCanvas"></canvas>
<div id="loading"><span>铁与权柄：1914</span></div>

<div id="countrySelect" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,15,26,0.95);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8d8b0;font-family:Georgia,serif;">
    <h1 style="font-size:32px;margin-bottom:8px;color:#c8b88a;">铁与权柄：1914</h1>
    <p style="font-size:14px;margin-bottom:30px;color:rgba(255,255,255,0.4);">选择你的国家</p>
    <div id="countryList" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-width:600px;">
    </div>
    <p style="margin-top:30px;font-size:12px;color:rgba(255,255,255,0.2);">鼠标悬停查看国家信息</p>
</div>

<script src="js/config.js"></script>
<script src="js/data_provinces.js"></script>
<script src="js/data_province_name_cn.js"></script>
<script src="js/data_cities.js"></script>
<script src="js/data_country_index.js"></script>
<script src="js/data_factories.js"></script>
<script src="js/game_ui.js"></script>
<script src="js/data_events.js"></script>
<script src="js/game_state.js"></script>
<script src="js/navy/shipGrades.js"></script>
<script src="js/navy/shipData.js"></script>
<script src="js/navy/shipNaming.js"></script>
<script src="js/navy/navyNode.js"></script>
<script src="js/navy/shipProductionUI.js"></script>
<script src="js/game_panels.js"></script>
<script src="js/tactical.js"></script>
<script src="js/game_core.js"></script>
<script src="js/game_init.js"></script>

<div id="errorMsg" style="position:fixed;bottom:10px;left:10px;background:rgba(200,0,0,0.8);color:#fff;padding:8px 12px;font-size:13px;z-index:200;display:none;max-width:80%;font-family:monospace;"></div>
<script>
window.onerror = function(msg, url, line) {
    var el = document.getElementById("errorMsg");
    if (el) { el.style.display = "block"; el.textContent = msg + " (line " + line + ")"; }
};
</script>
</body>
</html>
